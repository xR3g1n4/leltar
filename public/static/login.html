<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bejelentkezés – The Bias Wrecker</title>
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main class="login">
  <img class="logo" src="/macskaLogo.png" alt="The Bias Wrecker logó">
  <h1>THE BIAS WRECKER</h1>
  <p class="sub">K-POP raktárkezelő és készletnyilvántartó rendszer</p>

  <form id="loginForm">
    <label for="username">Felhasználónév:</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Jelszó:</label>
    <div class="pw">
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="eye" id="eye" type="button" aria-label="Jelszó megjelenítése" aria-pressed="false">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10.5 7 10.5 7a17 17 0 0 1-3.2 3.9M6.4 6.4A17 17 0 0 0 1.5 12S5.5 19 12 19a9.8 9.8 0 0 0 4.2-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button type="submit">Bejelentkezés</button>
  </form>
</main>
<script>
document.getElementById('eye').addEventListener('click', (e) => {
  const show = password.type === 'password';
  password.type = show ? 'text' : 'password';
  e.currentTarget.setAttribute('aria-pressed', show);
  e.currentTarget.setAttribute('aria-label', show ? 'Jelszó elrejtése' : 'Jelszó megjelenítése');
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.currentTarget.querySelector('button'), err = document.getElementById('err');
  err.textContent = ''; btn.disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username.value.trim(), password: password.value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Sikertelen bejelentkezés.');
    localStorage.setItem('token', data.token);
    location.href = '/leltar.html';
  } catch (ex) {
    err.textContent = ex.message === 'Failed to fetch' ? 'A szerver nem érhető el.' : ex.message;
  }
  btn.disabled = false;
});
</script>
</body>
</html>
