<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="leltar.css">
<title>Leltárkezelő – The Bias Wrecker</title>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div>
        <div class="shop">THE BIAS WRECKER</div>
        <div class="role" id="role">Dolgozó</div>
      </div>
    </div>
    <div class="grp">FŐ MODULOK</div>
    <button class="nav active" type="button" aria-current="page">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 6.5h12"/></svg>
      Leltárkezelő
    </button>
    <button class="nav" type="button" id="help">Súgó és Tudásbázis</button>
    <div class="side-foot">
      <button type="button" id="logout">Kijelentkezés</button>
      <span title="Esc billentyű">ESC</span>
    </div>
  </aside>

  <main>
    <form class="upload" id="uploadForm" autocomplete="off">
      <input name="album" placeholder="Album" aria-label="Album" required maxlength="120">
      <input name="artist" placeholder="Előadó" aria-label="Előadó" required maxlength="80">
      <input name="price" type="number" min="0" step="1" placeholder="Ár" aria-label="Ár (Ft)" required>
      <select name="status" aria-label="Státusz">
        <option value="" selected>Státusz</option>
        <option>Új</option><option>Bontott</option><option>Sérült</option>
      </select>
      <input name="storage" type="number" min="0" step="1" placeholder="Készlet" aria-label="Készlet (db)" required>
      <button class="go" type="submit">FELTÖLTÉS</button>
    </form>

    <div class="filters">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <select id="fArtist" aria-label="Szűrés előadóra"></select>
      <select id="fAlbum" aria-label="Szűrés albumra"></select>
      <select id="fSort" aria-label="Rendezés">
        <option value="">Rendezés</option>
        <option value="album">Album (A–Z)</option>
        <option value="artist">Előadó (A–Z)</option>
        <option value="price-asc">Ár (növekvő)</option>
        <option value="price-desc">Ár (csökkenő)</option>
        <option value="storage-asc">Készlet (növekvő)</option>
        <option value="storage-desc">Készlet (csökkenő)</option>
      </select>
    </div>

    <section class="stock">
      <div class="stock-head">
        <h1>Készletállomány</h1>
        <div class="legend"><span class="l-new">Új</span><span class="l-open">Bontott</span><span class="l-bad">Sérült</span></div>
      </div>
      <div class="cols" aria-hidden="true">
        <div>TERMÉKNÉV</div><div>ELŐADÓ</div><div>ÁR</div><div>STÁTUSZ</div><div>KÉSZLET</div>
      </div>
      <div class="list" id="list" aria-live="polite"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const token = localStorage.getItem('token');
if (!token) location.replace('/login.html');

const STATUSES = ['Új', 'Bontott', 'Sérült'];
const STATUS_CLASS = { 'Új': 'st-uj', 'Bontott': 'st-bontott', 'Sérült': 'st-serult' };

let products = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtPrice = (n) => Number(n).toLocaleString('hu-HU') + ' Ft';

/* ---------- API ---------- */
async function api(path, options = {}) {
  const res = await fetch('/api' + path, {
    ...options,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(options.headers || {}) },
  });
  if (res.status === 401) {
    localStorage.removeItem('token');
    location.replace('/login.html');
    throw new Error('Lejárt a munkamenet.');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Valami hiba történt.');
  return data;
}

let toastTimer;
function toast(msg, isError = false) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('err', isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- Megjelenítés ---------- */
function rowHTML(p) {
  const bad = p.status === 'Sérült';
  const options = STATUSES.map((s) => `<option${s === p.status ? ' selected' : ''}>${s}</option>`).join('');
  return `
  <div class="row${bad ? ' is-bad' : ''}" data-id="${p.id}">
    <div class="c-name">
      <span class="thumb" aria-hidden="true"></span>
      <span class="name">${esc(p.album)}${bad ? '<small>(SÉRÜLT)</small>' : ''}</span>
    </div>
    <div class="c-artist">${esc(p.artist)}</div>
    <div class="c-price">${fmtPrice(p.price)}</div>
    <div class="c-status">
      <select class="pill ${STATUS_CLASS[p.status] || ''}" data-act="status" aria-label="Státusz: ${esc(p.album)}">${options}</select>
    </div>
    <div class="c-stock">
      <button class="qty-btn" data-act="dec" type="button" aria-label="Készlet csökkentése"${p.storage <= 0 ? ' disabled' : ''}>−</button>
      <span class="qty">${p.storage}</span>
      <button class="qty-btn" data-act="inc" type="button" aria-label="Készlet növelése">+</button>
    </div>
  </div>`;
}

function fillSelect(sel, firstLabel, values, current) {
  sel.innerHTML = `<option value="">${firstLabel}</option>` +
    values.map((v) => `<option value="${esc(v)}"${v === current ? ' selected' : ''}>${esc(v)}</option>`).join('');
  if (!values.includes(current)) sel.value = '';
}

function refreshFilters() {
  const artist = $('fArtist').value;
  const artists = [...new Set(products.map((p) => p.artist))].sort((a, b) => a.localeCompare(b, 'hu'));
  fillSelect($('fArtist'), 'Összes előadó', artists, artist);

  const pool = $('fArtist').value ? products.filter((p) => p.artist === $('fArtist').value) : products;
  const albums = [...new Set(pool.map((p) => p.album))].sort((a, b) => a.localeCompare(b, 'hu'));
  fillSelect($('fAlbum'), 'Összes album', albums, $('fAlbum').value);
}

function visibleProducts() {
  const artist = $('fArtist').value, album = $('fAlbum').value, sort = $('fSort').value;
  let list = products.filter((p) => (!artist || p.artist === artist) && (!album || p.album === album));
  const by = {
    'album': (a, b) => a.album.localeCompare(b.album, 'hu'),
    'artist': (a, b) => a.artist.localeCompare(b.artist, 'hu'),
    'price-asc': (a, b) => a.price - b.price,
    'price-desc': (a, b) => b.price - a.price,
    'storage-asc': (a, b) => a.storage - b.storage,
    'storage-desc': (a, b) => b.storage - a.storage,
  }[sort];
  if (by) list = [...list].sort(by);
  return list;
}

function render() {
  const list = visibleProducts();
  $('list').innerHTML = list.length
    ? list.map(rowHTML).join('')
    : `<div class="empty">${products.length
        ? 'Nincs a szűrésnek megfelelő termék.<br>Válaszd az „Összes" lehetőséget, vagy vigyél fel új terméket.'
        : 'Még nincs termék a raktárban.<br>Töltsd fel az elsőt a fenti sávban.'}</div>`;
}

function replaceRow(updated) {
  const i = products.findIndex((p) => p.id === updated.id);
  if (i >= 0) products[i] = updated;
  const old = document.querySelector(`.row[data-id="${updated.id}"]`);
  if (!old) return render();
  old.outerHTML = rowHTML(updated);
}

/* ---------- Műveletek ---------- */
async function loadProducts() {
  products = await api('/products');
  refreshFilters();
  render();
}

$('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = Number(btn.closest('.row').dataset.id);
  const change = btn.dataset.act === 'inc' ? 1 : -1;
  btn.disabled = true;
  try {
    const updated = await api(`/products/${id}/stock`, { method: 'PATCH', body: JSON.stringify({ change }) });
    replaceRow(updated);
  } catch (err) {
    toast(err.message, true);
    render();
    return;
  }
  document.querySelector(`.row[data-id="${id}"] [data-act="${btn.dataset.act}"]`)?.focus({ preventScroll: true });
});

$('list').addEventListener('change', async (e) => {
  const sel = e.target.closest('select[data-act="status"]');
  if (!sel) return;
  const id = Number(sel.closest('.row').dataset.id);
  try {
    const updated = await api(`/products/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status: sel.value }) });
    replaceRow(updated);
    toast(`Státusz módosítva: ${updated.status}`);
  } catch (err) {
    toast(err.message, true);
    render();
  }
});

$('uploadForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.currentTarget;
  const fd = new FormData(form);
  const body = {
    album: fd.get('album').trim(),
    artist: fd.get('artist').trim(),
    price: parseInt(fd.get('price'), 10),
    status: fd.get('status') || 'Új',
    storage: parseInt(fd.get('storage'), 10),
  };
  const submit = form.querySelector('.go');
  submit.disabled = true;
  try {
    const created = await api('/products', { method: 'POST', body: JSON.stringify(body) });
    products.push(created);
    form.reset();
    refreshFilters();
    render();
    toast(`Feltöltve: ${created.artist} – ${created.album}`);
  } catch (err) {
    toast(err.message, true);
  } finally {
    submit.disabled = false;
  }
});

['fArtist', 'fAlbum', 'fSort'].forEach((id) =>
  $(id).addEventListener('change', () => {
    if (id === 'fArtist') refreshFilters(); // az album lista az előadóhoz igazodik
    render();
  })
);

async function logout() {
  try { await api('/auth/logout', { method: 'POST' }); } catch {}
  localStorage.removeItem('token');
  location.replace('/login.html');
}
$('logout').addEventListener('click', logout);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.activeElement === document.body && confirm('Biztosan kijelentkezel?')) logout();
});
$('help').addEventListener('click', () => toast('A súgó még készül.'));

/* ---------- Indítás ---------- */
(async () => {
  try {
    const me = await api('/auth/me');
    $('role').textContent = me.role;
    $('role').title = me.username;
    await loadProducts();
  } catch (err) {
    toast(err.message, true);
  }
})();
</script>
</body>
</html>
